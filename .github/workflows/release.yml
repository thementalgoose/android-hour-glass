name: Release
env:
  RUN_OFFSET: 2
'on':
  release:
    types: [published]
  workflow_dispatch:
jobs:

  json_checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: json-syntax-check
        uses: limitusus/json-syntax-check@v2
        with:
          pattern: "\\.json$"

  unit_tests:
    uses: ./.github/workflows/job-unit-tests.yml
    secrets: inherit

  ui_tests:
    uses: ./.github/workflows/job-ui-tests.yml
    secrets: inherit

  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.get_version.outputs.version_name }}
      version_code_app: ${{ steps.get_version.outputs.version_code_app }}
      version_code_wear: ${{ steps.get_version.outputs.version_code_wear }}
    steps:
      - name: Calculate Versions
        id: get_version
        run: |
          VERSION_NAME=$(echo $GITHUB_REF | cut -d / -f 3)
          BASE_CODE=$((${{ github.run_number }} + $RUN_OFFSET))
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code_app=${BASE_CODE}00" >> $GITHUB_OUTPUT
          echo "version_code_wear=${BASE_CODE}01" >> $GITHUB_OUTPUT

  deploy_app:
    needs: [unit_tests, versions, ui_tests]
    uses: ./.github/workflows/job-deploy.yml
    secrets: inherit
    with:
      version_name: ${{ needs.versions.outputs.version_name }}
      version_code: ${{ needs.versions.outputs.version_code_app }}

  deploy_wear:
    needs: [unit_tests, versions, ui_tests]
    uses: ./.github/workflows/job-deploy-wearos.yml
    secrets: inherit
    with:
      version_name: ${{ needs.versions.outputs.version_name }}
      version_code: ${{ needs.versions.outputs.version_code_wear }}

  discord_notify_success:
    runs-on: ubuntu-latest
    needs: [versions, deploy_app, deploy_wear]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Notify discord of success
        uses: sarisia/actions-status-discord@v1.16.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          nodetail: true
          title: "Android: Release ${{ needs.versions.outputs.version_name }} (App: ${{ needs.versions.outputs.version_code_app }}, Wear: ${{ needs.versions.outputs.version_code_wear }}) deployed"
          description: |
            Github Action [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [Google Play](https://play.google.com/console/u/0/developers/7104925501019224102/app/4972386210601361096/app-dashboard)
          color: 0x3dc91a

  discord_notify_failed:
    runs-on: ubuntu-latest
    needs: [versions, deploy_app, deploy_wear]
    if: always() && (needs.deploy_app.result == 'failure' || needs.deploy_wear.result == 'failure')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Notify discord of failure
        uses: sarisia/actions-status-discord@v1.16.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          nodetail: true
          title: "Android: Release ${{ needs.versions.outputs.version_name }} deployment FAILED"
          description: |
            Deployment status:
            - Phone App: ${{ needs.deploy_app.result }}
            - Wear OS: ${{ needs.deploy_wear.result }}
            Github Action [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [Google Play](https://play.google.com/console/u/0/developers/7104925501019224102/app/4972386210601361096/app-dashboard)
          color: 0xdf0000
