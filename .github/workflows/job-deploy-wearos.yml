name: Job - Deploy WearOS

on:
  workflow_call:
    inputs:
      version_name: { required: true, type: string }
      version_code: { required: true, type: string }
  workflow_dispatch:
    inputs:
      version_name: { required: true, type: string }
      version_code: { required: true, type: string }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # Checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup Java 25
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      # Caching gradle
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/*.toml*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Environment
      - name: Environment variables
        run: |
          echo ${{ secrets.ENCODED_GOOGLE_SERVICES_LIVE }} | base64 --decode >> wearos/src/release/google-services.json

      # Building version
      - name: Building version
        run: |
          echo Version name: ${{ inputs.version_name }}
          echo Version code: ${{ inputs.version_code }}

      # Assemble APK
      - name: Assemble APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :wearos:assembleRelease

      # Assemble AAB
      - name: Assemble bundle
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :wearos:bundleRelease

      # Sign Wear OS AAB
      - name: Sign wearos app bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_wearos_aab
        with:
          releaseDirectory: wearos/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ENCODED_KEYSTORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "37.0.0"

      # Sign Wear OS APK
      - name: Sign wearos app apk
        uses: r0adkll/sign-android-release@v1
        id: sign_wearos_apk
        with:
          releaseDirectory: wearos/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ENCODED_KEYSTORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "37.0.0"

      # Deploy Wear OS Bundle to Google Play wearos track
      - name: Deploy Wear OS Bundle to google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT }}
          packageName: tmg.hourglass
          releaseFiles: wearos/build/outputs/bundle/**/*.aab
          tracks: wear:internal
          whatsNewDirectory: release-notes
          status: "completed"
          mappingFile: wearos/build/outputs/mapping/release/mapping.txt

      # Rename signed APK and AAB
      - name: Rename signed apk and bundle
        run: |
          mv wearos/build/outputs/apk/release/wearos-release-unsigned-signed.apk wearos/build/outputs/apk/release/wearos.apk
          mv wearos/build/outputs/bundle/release/wearos-release.aab wearos/build/outputs/bundle/release/wearos.aab

      # Add artifact to tag
      - name: Upload file to github tag
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            wearos/build/outputs/apk/release/wearos.apk
            wearos/build/outputs/bundle/release/wearos.aab