name: Job - Deploy WearOS

on:
  workflow_call:
    inputs:
      version_name: { required: true, type: string }
      version_code: { required: true, type: string }
  workflow_dispatch:
    inputs:
      version_name: { required: true, type: string }
      version_code: { required: true, type: string }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # Checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup Java 25
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      # Caching gradle
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/*.toml*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Building version
      - name: Building version
        run: |
          echo Version name: ${{ inputs.version_name }}
          echo Version code: ${{ inputs.version_code }}

      # Assemble APK
      - name: Assemble APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :wearos:assembleRelease

      # Assemble AAB
      - name: Assemble bundle
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :wearos:bundleRelease

      # Sign Wear OS AAB
      - name: Sign wearos app bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_wearos_aab
        with:
          releaseDirectory: wearos/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ENCODED_KEYSTORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "37.0.0"

      # Sign Wear OS APK
      - name: Sign wearos app apk
        uses: r0adkll/sign-android-release@v1
        id: sign_wearos_apk
        with:
          releaseDirectory: wearos/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ENCODED_KEYSTORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "37.0.0"

      # Upload signed artifact info
      - name: Upload artifact info
        uses: actions/upload-artifact@v7
        with:
          name: WearOS-AAB
          path: |
            wearos/build/outputs/bundle/**/*.aab
            wearos/build/outputs/apk/**/*.apk
            wearos/build/outputs/mapping/**/mapping.txt

      # Deploy Wear OS Bundle to Google Play wearos track
      - name: Deploy Wear OS Bundle to google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT }}
          packageName: tmg.hourglass
          releaseFiles: wearos/build/outputs/bundle/**/*.aab
          track: wearos-internal
          whatsNewDirectory: release-notes
          status: "completed"
          mappingFile: wearos/build/outputs/mapping/release/mapping.txt
